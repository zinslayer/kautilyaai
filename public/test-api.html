<!DOCTYPE html>
<html>

<head>
    <title>Quick API Test</title>
</head>

<body>
    <h1>Test Backend Connection</h1>
    <button onclick="testConnection()">Test Connection</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                // Test 1: Health check
                const healthResponse = await fetch('http://localhost:8000/health');
                const healthData = await healthResponse.json();
                resultDiv.innerHTML += `<p style="color: green;">✅ Health check: ${JSON.stringify(healthData)}</p>`;

                // Test 2: Check CORS
                const corsTest = await fetch('http://localhost:8000/api/v1/public/upload-public', {
                    method: 'OPTIONS'
                });
                resultDiv.innerHTML += `<p style="color: green;">✅ CORS preflight: ${corsTest.status}</p>`;

                resultDiv.innerHTML += '<p style="color: green;"><strong>Backend is accessible!</strong></p>';
            } catch (error) {
                resultDiv.innerHTML += `<p style="color: red;">❌ Error: ${error.message}</p>`;
                resultDiv.innerHTML += `<p>Make sure you open this file via http://localhost:3000 or a local server, not file://</p>`;
            }
        }
    </script>
</body>

</html>
